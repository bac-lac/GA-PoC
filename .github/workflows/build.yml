name: Build
description: Build and push GoAnywhere to AWS

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

  push:
    branches:
      - main

permissions:
      id-token: write
      contents: read
      actions: write

jobs:
  Code-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        uses: sudo-bot/action-shellcheck@latest
        with:
          cli-args: "./docker/scripts/*.sh"
  Build:
    needs: Code-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEVOPS_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ca-central-1
          role-skip-session-tagging: true
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Generate next tag
        run: |
          REPO="bac-lac-gc-ca/mft"
          LATEST=$(
            aws ecr describe-images \
              --repository-name "$REPO" |
            jq -r '
              [.imageDetails[].imageTags[]?]
              | map(select(test("^v[0-9]+$")))
              | map(sub("^v"; "") | tonumber)
              | max // 0
            '
          )
      
          NEXT="v$((LATEST + 1))"
      
          echo "IMAGE_TAG=$NEXT" >> $GITHUB_ENV
          echo "Next tag: $NEXT"

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/bac-lac-gc-ca/mft:latest
            ${{ steps.login-ecr.outputs.registry }}/bac-lac-gc-ca/mft:${{ env.IMAGE_TAG }}

      - name: Get latest version immutable image URI
        run: |
          REPO=bac-lac-gc-ca/mft
          REGISTRY=$(aws ecr describe-repositories --repository-names "$REPO" --query 'repositories[0].repositoryUri' --output text)
          VERSION_TAG=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag=latest --query 'imageDetails[0].imageTags' --output json | jq -r '.[] | select(. != "latest")')
          IMAGE_URI="${REGISTRY}:${VERSION_TAG}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "IMAGE_URI: $IMAGE_URI"
